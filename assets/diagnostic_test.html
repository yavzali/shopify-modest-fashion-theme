<!DOCTYPE html>
<html>
<head>
    <title>Ajax Filters Diagnostic Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .pass { color: green; }
        .fail { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>Ajax Filters System Diagnostic</h1>
    
    <div class="test-section">
        <h2>System Status</h2>
        <div id="system-status"></div>
    </div>
    
    <div class="test-section">
        <h2>Element Detection</h2>
        <div id="element-detection"></div>
    </div>
    
    <div class="test-section">
        <h2>Event Handler Testing</h2>
        <div id="event-testing"></div>
        <button onclick="testCheckboxClick()">Test Checkbox Click</button>
        <button onclick="testDirectStateUpdate()">Test Direct State Update</button>
    </div>
    
    <div class="test-section">
        <h2>Ajax Testing</h2>
        <div id="ajax-testing"></div>
        <button onclick="testAjaxCall()">Test Ajax Call</button>
    </div>
    
    <div class="test-section">
        <h2>Console Logs</h2>
        <div id="console-logs"></div>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>

    <script>
        // Capture console logs
        const originalLog = console.log;
        const originalError = console.error;
        const logs = [];
        
        function captureLog(level, ...args) {
            const timestamp = new Date().toISOString().substr(11, 12);
            logs.push({level, timestamp, message: args.join(' ')});
            updateLogsDisplay();
            if (level === 'log') originalLog(...args);
            if (level === 'error') originalError(...args);
        }
        
        console.log = (...args) => captureLog('log', ...args);
        console.error = (...args) => captureLog('error', ...args);
        
        function updateLogsDisplay() {
            const container = document.getElementById('console-logs');
            container.innerHTML = logs.slice(-20).map(log => 
                `<div class="${log.level}">[${log.timestamp}] ${log.message}</div>`
            ).join('');
        }
        
        function clearLogs() {
            logs.length = 0;
            updateLogsDisplay();
        }
        
        // Wait for page load then run diagnostics
        window.addEventListener('load', () => {
            setTimeout(runDiagnostics, 1000);
        });
        
        function runDiagnostics() {
            console.log('=== STARTING DIAGNOSTIC TESTS ===');
            
            // Test system status
            testSystemStatus();
            
            // Test element detection
            testElementDetection();
            
            console.log('=== DIAGNOSTIC TESTS COMPLETE ===');
        }
        
        function testSystemStatus() {
            const container = document.getElementById('system-status');
            let html = '';
            
            // Check if AjaxFilters class exists
            if (typeof AjaxFilters !== 'undefined') {
                html += '<div class="pass">✓ AjaxFilters class exists</div>';
            } else {
                html += '<div class="fail">✗ AjaxFilters class not found</div>';
            }
            
            // Check if instance exists
            if (window.ajaxFiltersInstance) {
                html += '<div class="pass">✓ AjaxFilters instance exists</div>';
                html += `<div class="info">Feature flag: ${window.ajaxFiltersInstance.ENABLE_NATIVE_SINGLE_RETAILER}</div>`;
                html += `<div class="info">Initialized: ${window.ajaxFiltersInstance.initialized}</div>`;
                html += `<div class="info">Active filters: ${JSON.stringify(window.ajaxFiltersInstance.activeFilters)}</div>`;
                html += `<div class="info">Preventing native: ${window.ajaxFiltersInstance.preventingNativeHandler}</div>`;
            } else {
                html += '<div class="fail">✗ AjaxFilters instance not found</div>';
            }
            
            container.innerHTML = html;
        }
        
        function testElementDetection() {
            const container = document.getElementById('element-detection');
            let html = '';
            
            // Test key selectors
            const selectors = [
                '#Details-retailer-filter .facets__summary-label',
                '#Details-retailer-filter .facets__header .facets__selected',
                '#Details-retailer-filter summary',
                '#ajax-filter-pills',
                '.active-facets.active-facets-desktop',
                'input[name="filter.p.tag"]'
            ];
            
            selectors.forEach(selector => {
                const elements = document.querySelectorAll(selector);
                if (elements.length > 0) {
                    html += `<div class="pass">✓ Found ${elements.length} elements: ${selector}</div>`;
                } else {
                    html += `<div class="fail">✗ No elements found: ${selector}</div>`;
                }
            });
            
            container.innerHTML = html;
        }
        
        function testCheckboxClick() {
            const container = document.getElementById('event-testing');
            console.log('=== TESTING CHECKBOX CLICK ===');
            
            const checkbox = document.querySelector('input[name="filter.p.tag"]');
            if (!checkbox) {
                container.innerHTML += '<div class="fail">✗ No checkbox found to test</div>';
                return;
            }
            
            const wasChecked = checkbox.checked;
            console.log('Checkbox before click:', checkbox.value, wasChecked);
            
            // Simulate click
            checkbox.click();
            
            const isChecked = checkbox.checked;
            console.log('Checkbox after click:', checkbox.value, isChecked);
            
            if (wasChecked !== isChecked) {
                container.innerHTML += '<div class="pass">✓ Checkbox state changed</div>';
            } else {
                container.innerHTML += '<div class="fail">✗ Checkbox state did not change</div>';
            }
            
            // Check if instance state updated
            if (window.ajaxFiltersInstance) {
                const activeFilters = window.ajaxFiltersInstance.activeFilters;
                container.innerHTML += `<div class="info">Active filters after click: ${JSON.stringify(activeFilters)}</div>`;
            }
        }
        
        function testDirectStateUpdate() {
            const container = document.getElementById('event-testing');
            console.log('=== TESTING DIRECT STATE UPDATE ===');
            
            if (!window.ajaxFiltersInstance) {
                container.innerHTML += '<div class="fail">✗ No instance to test</div>';
                return;
            }
            
            const instance = window.ajaxFiltersInstance;
            const originalFilters = [...instance.activeFilters];
            
            // Try to add a filter directly
            instance.activeFilters = ['ASOS'];
            console.log('Set active filters to:', instance.activeFilters);
            
            // Try to update UI
            try {
                instance.updateUI();
                container.innerHTML += '<div class="pass">✓ updateUI() called without error</div>';
            } catch (error) {
                container.innerHTML += `<div class="fail">✗ updateUI() failed: ${error.message}</div>`;
                console.error('updateUI error:', error);
            }
            
            // Restore original state
            instance.activeFilters = originalFilters;
        }
        
        function testAjaxCall() {
            const container = document.getElementById('ajax-testing');
            console.log('=== TESTING AJAX CALL ===');
            
            if (!window.ajaxFiltersInstance) {
                container.innerHTML += '<div class="fail">✗ No instance to test</div>';
                return;
            }
            
            const instance = window.ajaxFiltersInstance;
            
            // Try a simple fetch
            const testUrl = '/collections/all?filter.p.tag=ASOS&section_id=main-collection-product-grid';
            
            fetch(testUrl)
                .then(response => {
                    if (response.ok) {
                        container.innerHTML += '<div class="pass">✓ Ajax call succeeded</div>';
                        return response.text();
                    } else {
                        container.innerHTML += `<div class="fail">✗ Ajax call failed: ${response.status}</div>`;
                    }
                })
                .then(html => {
                    if (html) {
                        container.innerHTML += `<div class="info">Response length: ${html.length} characters</div>`;
                        
                        // Test parsing
                        try {
                            const result = instance.parseFilterResponse(html);
                            container.innerHTML += `<div class="pass">✓ Response parsing succeeded</div>`;
                            container.innerHTML += `<div class="info">Products found: ${result.products ? result.products.length : 'unknown'}</div>`;
                        } catch (error) {
                            container.innerHTML += `<div class="fail">✗ Response parsing failed: ${error.message}</div>`;
                        }
                    }
                })
                .catch(error => {
                    container.innerHTML += `<div class="fail">✗ Ajax call error: ${error.message}</div>`;
                    console.error('Ajax test error:', error);
                });
        }
        
        // Add global test functions
        window.runDiagnostics = runDiagnostics;
        window.testCheckboxClick = testCheckboxClick;
        window.testDirectStateUpdate = testDirectStateUpdate;
        window.testAjaxCall = testAjaxCall;
        window.clearLogs = clearLogs;
    </script>
</body>
</html>
